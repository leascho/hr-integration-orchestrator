name: hr-integration-orchestrator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-downstream:
    build: .
    command: ["uvicorn", "mock_services.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      SIMULATE_IDENTITY_TIMEOUT: ${SIMULATE_IDENTITY_TIMEOUT:-false}
      SIMULATE_IDENTITY_TIMEOUT_FAILURES: ${SIMULATE_IDENTITY_TIMEOUT_FAILURES:-2}
      SIMULATE_COLLABORATION_FAILURE: ${SIMULATE_COLLABORATION_FAILURE:-false}
      SIMULATE_NOTIFICATION_FAILURE: ${SIMULATE_NOTIFICATION_FAILURE:-false}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  orchestrator:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orchestrator:local-dev-only@postgres:5432/orchestrator}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IDENTITY_SERVICE_BASE_URL: ${IDENTITY_SERVICE_BASE_URL:-http://mock-downstream:8100/identity}
      COLLABORATION_SERVICE_BASE_URL: ${COLLABORATION_SERVICE_BASE_URL:-http://mock-downstream:8100/collaboration}
      NOTIFICATION_SERVICE_BASE_URL: ${NOTIFICATION_SERVICE_BASE_URL:-http://mock-downstream:8100/notification}
      RETRY_MAX_RETRIES: ${RETRY_MAX_RETRIES:-3}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-0.5}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-4}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-downstream:
        condition: service_healthy

volumes:
  pgdata:

